x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "3000"
  COMMAND_DATABASE_URL: "postgresql://user:${DB_PASSWORD:?Set DB_PASSWORD in .env}@pgbouncer_cmd:6432/ticket-master"
  QUERY_DATABASE_URL: "postgresql://user:${DB_PASSWORD:?Set DB_PASSWORD in .env}@pgbouncer_query:6432/ticket-query"
  REDIS_NODES: "redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379"

services:
  # -----------------------------------------------
  # COMMAND DATABASE
  # -----------------------------------------------
  postgres:
    image: postgres:16.2
    container_name: ticket-master-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket-master
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticket-booking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ticket-master"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_query:
    image: postgres:16.2
    container_name: ticket-master-postgres-query
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket-query
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_query_data:/var/lib/postgresql/data
    networks:
      - ticket-booking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ticket-query"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------------------------------------
  # PGBOUNCER - COMMAND DATABASE
  # -----------------------------------------------
  pgbouncer_cmd:
    image: edoburu/pgbouncer:v1.26.0-p0
    container_name: ticket-master-pgbouncer-command
    restart: unless-stopped
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/command.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticket-booking-network

  # -----------------------------------------------
  # PGBOUNCER - QUERY DATABASE
  # -----------------------------------------------
  pgbouncer_query:
    image: edoburu/pgbouncer:v1.26.0-p0
    container_name: ticket-master-pgbouncer-query
    restart: unless-stopped
    ports:
      - "6433:6432"
    volumes:
      - ./pgbouncer/query.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres_query:
        condition: service_healthy
    
    networks:
      - ticket-booking-network



  redis-node-1:
    image: redis:7-alpine
    container_name: ticket-master-redis-1
    restart: unless-stopped
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7001:6379"
    networks:
      ticket-booking-network:
        ipv4_address: 172.28.0.11

  redis-node-2:
    image: redis:7-alpine
    container_name: ticket-master-redis-2
    restart: unless-stopped
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7002:6379"
    networks:
      ticket-booking-network:
        ipv4_address: 172.28.0.12

  redis-node-3:
    image: redis:7-alpine
    container_name: ticket-master-redis-3
    restart: unless-stopped
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7003:6379"
    networks:
      ticket-booking-network:
        ipv4_address: 172.28.0.13

  redis-node-4:
    image: redis:7-alpine
    container_name: ticket-master-redis-4
    restart: unless-stopped
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7004:6379"
    networks:
      ticket-booking-network:
        ipv4_address: 172.28.0.14

  redis-node-5:
    image: redis:7-alpine
    container_name: ticket-master-redis-5
    restart: unless-stopped
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7005:6379"
    networks:
      ticket-booking-network:
        ipv4_address: 172.28.0.15

  redis-node-6:
    image: redis:7-alpine
    container_name: ticket-master-redis-6
    restart: unless-stopped
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7006:6379"
    networks:
      ticket-booking-network:
        ipv4_address: 172.28.0.16

  # One-shot job: waits for the nodes, then creates the cluster unless it
  # already exists.
  redis-cluster-init:
    image: redis:7-alpine
    container_name: ticket-master-redis-init
    restart: "no"
    networks:
      - ticket-booking-network
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    command: >
      sh -c "
      for i in 1 2 3 4 5 6; do
        until redis-cli -h redis-node-$$i ping 2>/dev/null | grep -q PONG; do sleep 1; done;
      done;
      if redis-cli -h redis-node-1 cluster info | grep -q 'cluster_state:ok'; then
        echo 'Redis cluster already configured'; exit 0;
      fi;
      echo yes | redis-cli --cluster create
      172.28.0.11:6379 172.28.0.12:6379 172.28.0.13:6379
      172.28.0.14:6379 172.28.0.15:6379 172.28.0.16:6379
      --cluster-replicas 1
      "

  # -----------------------------------------------
  # EXPRESS API - INSTANCE 1
  # -----------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ticket-master-api
    environment:
      <<: *api-environment
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      pgbouncer_cmd:
        condition: service_started
      pgbouncer_query:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - ticket-booking-network

  # -----------------------------------------------
  # BACKGROUND WORKER - outbox publisher + projection consumer
  # -----------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: ticket-master-worker
    command: ["npm", "run", "worker"]
    environment:
      <<: *api-environment
      DB_POOL_MAX: "5"
      OUTBOX_POLL_INTERVAL_MS: "1000"
    env_file:
      - .env
    depends_on:
      pgbouncer_cmd:
        condition: service_started
      pgbouncer_query:
        condition: service_started
      redis-cluster-init:
        condition: service_completed_successfully
    networks:
      - ticket-booking-network

  # -----------------------------------------------
  # PROMETHEUS
  # -----------------------------------------------
  prometheus:
    image: prom/prometheus
    container_name: ticket-master-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # -----------------------------------------------
  # GRAFANA
  # -----------------------------------------------
  grafana:
    image: grafana/grafana
    container_name: ticket-master-grafana
    restart: unless-stopped
    ports:
      - "5003:3000"
    volumes:
      - grafana_data:/var/lib/grafana

# -----------------------------------------------
# NETWORKS
# -----------------------------------------------
networks:
  ticket-booking-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# -----------------------------------------------
# NAMED VOLUMES
# -----------------------------------------------
volumes:
  postgres_data:
  postgres_query_data:
  prometheus_data:
  grafana_data: