x-redis-node: &redis-node
  image: redis:7-alpine
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.2
    container_name: ticket-master-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket-master
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ticket-master"]
      interval: 5s
      timeout: 5s
      retries: 3

  postgres_query:
    image: postgres:16.2
    container_name: ticket-master-postgres-query
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket-query
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_query_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ticket-query"]
      interval: 5s
      timeout: 5s
      retries: 3

  pgbouncer_cmd:
    image: edoburu/pgbouncer:v1.26.0-p0
    container_name: ticket-master-pgbouncer-command
    restart: unless-stopped
    ports:
      - "127.0.0.1:6432:6432"
    volumes:
      - ./pgbouncer/command.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy

  pgbouncer_query:
    image: edoburu/pgbouncer:v1.26.0-p0
    container_name: ticket-master-pgbouncer-query
    restart: unless-stopped
    ports:
      - "127.0.0.1:6433:6432"
    volumes:
      - ./pgbouncer/query.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres_query:
        condition: service_healthy

  redis-node-1:
    <<: *redis-node
    container_name: ticket-master-redis-1
    command: >
      redis-server --port 7001 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --appendonly yes
    ports:
      - "127.0.0.1:7001:7001"
    volumes:
      - redis_node_1:/data
    networks:
      redis_cluster:
        ipv4_address: 172.30.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-2:
    <<: *redis-node
    container_name: ticket-master-redis-2
    command: >
      redis-server --port 7002 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --appendonly yes
    ports:
      - "127.0.0.1:7002:7002"
    volumes:
      - redis_node_2:/data
    networks:
      redis_cluster:
        ipv4_address: 172.30.0.12
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-3:
    <<: *redis-node
    container_name: ticket-master-redis-3
    command: >
      redis-server --port 7003 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --appendonly yes
    ports:
      - "127.0.0.1:7003:7003"
    volumes:
      - redis_node_3:/data
    networks:
      redis_cluster:
        ipv4_address: 172.30.0.13
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-4:
    <<: *redis-node
    container_name: ticket-master-redis-4
    command: >
      redis-server --port 7004 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --appendonly yes
    ports:
      - "127.0.0.1:7004:7004"
    volumes:
      - redis_node_4:/data
    networks:
      redis_cluster:
        ipv4_address: 172.30.0.14
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-5:
    <<: *redis-node
    container_name: ticket-master-redis-5
    command: >
      redis-server --port 7005 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --appendonly yes
    ports:
      - "127.0.0.1:7005:7005"
    volumes:
      - redis_node_5:/data
    networks:
      redis_cluster:
        ipv4_address: 172.30.0.15
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-node-6:
    <<: *redis-node
    container_name: ticket-master-redis-6
    command: >
      redis-server --port 7006 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --appendonly yes
    ports:
      - "127.0.0.1:7006:7006"
    volumes:
      - redis_node_6:/data
    networks:
      redis_cluster:
        ipv4_address: 172.30.0.16
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7006", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-cluster-init:
    image: redis:7-alpine
    container_name: ticket-master-redis-init
    restart: "no"
    networks:
      - redis_cluster
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
    command: >
      sh -c "redis-cli --cluster create
      172.30.0.11:7001 172.30.0.12:7002 172.30.0.13:7003
      172.30.0.14:7004 172.30.0.15:7005 172.30.0.16:7006
      --cluster-replicas 1 --cluster-yes"

  prometheus:
    image: prom/prometheus
    container_name: ticket-master-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana
    container_name: ticket-master-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

networks:
  redis_cluster:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
  postgres_query_data:
  redis_node_1:
  redis_node_2:
  redis_node_3:
  redis_node_4:
  redis_node_5:
  redis_node_6:
  prometheus_data:
  grafana_data: